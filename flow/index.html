<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>foqs. flow</title>
<meta name="description" content="foqs. flow - prihodki, stroški in plačila na enem mestu.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141213">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141213;--s1:#1d1a1b;--s2:#231F20;--s3:#2e292a;--line:rgba(255,255,255,.08);--tx:#f5f2f2;--mu:#a59e9f;--acc:#46BEC5;--acc-rgb:70,190,197;--out:#F0806A;--warn:#E8D06B;--r:20px;--pad:22px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;overflow:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.stage{height:100%;display:flex;align-items:center;justify-content:center;transition:padding .5s var(--ease)}
.app{position:relative;width:100%;height:100%;display:flex;background:var(--bg);overflow:hidden;overflow:clip;transition:width .6s var(--ease),height .6s var(--ease),border-radius .6s var(--ease),box-shadow .6s}
.glow{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.16),transparent 65%);top:-220px;right:-140px;pointer-events:none;animation:drift 14s ease-in-out infinite alternate;transition:background .6s}
@keyframes drift{to{transform:translate(-90px,70px) scale(1.15)}}
/* sidebar */
.side{position:relative;z-index:2;width:232px;flex:none;padding:26px 16px 18px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(20,18,19,.6);backdrop-filter:blur(12px)}
.logo{height:30px;margin:0 0 30px 10px;align-self:flex-start;display:flex;align-items:flex-end;gap:9px}
.logo span,.llogo span{font-size:20px;font-weight:500;color:var(--mu);line-height:1;margin-bottom:-4px}
.logo img{height:100%;display:block}
.nav{position:relative;display:flex;flex-direction:column;gap:4px}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;color:var(--mu);font-weight:500;text-align:left;transition:color .25s}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.nav button:hover{color:var(--tx)}
.nav button{max-height:60px;overflow:hidden;transition:color .25s,max-height .35s var(--ease),padding .35s var(--ease),opacity .25s,max-width .35s var(--ease),flex .35s var(--ease)}
.nav button.off{max-height:0;padding-top:0;padding-bottom:0;opacity:0;pointer-events:none;margin-top:-4px}
.mobile .nav button.off{max-height:60px;max-width:0;flex:0;padding:0;margin:0}
.nav button:hover svg{transform:scale(1.12)}
.nav button.on{color:var(--tx)}
.nav button.on svg{stroke:var(--acc)}
.ind{position:absolute;left:0;top:0;width:100%;height:43px;border-radius:13px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line);transition:transform .45s var(--ease),width .45s var(--ease)}
.ind:after{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--acc)}
.add{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;background:var(--acc);color:#10201f;font-weight:600;transition:transform .2s var(--ease),box-shadow .3s}
.add:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(var(--acc-rgb),.35)}
.add:active{transform:scale(.97)}
.hint{margin-top:12px;font-size:11px;color:var(--mu);text-align:center}
kbd{font:inherit;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--s3);border:1px solid var(--line)}
/* main */
.main{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:22px 30px 8px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month{display:flex;align-items:center;gap:2px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px}
.month button{width:34px;height:34px;border-radius:10px;color:var(--mu);font-size:17px;transition:background .2s,color .2s,transform .15s}
.month button:hover{background:var(--s3);color:var(--tx)}
.month button:active{transform:scale(.88)}
.month button:disabled{opacity:.25;pointer-events:none}
.mlab{position:relative;width:250px;white-space:nowrap;height:34px;overflow:hidden;text-align:center;font-weight:600}
.mlab span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px}
.mlab .l-in-r{animation:lin-r .4s var(--ease)}.mlab .l-in-l{animation:lin-l .4s var(--ease)}
@keyframes lin-r{from{transform:translateX(60%);opacity:0}}@keyframes lin-l{from{transform:translateX(-60%);opacity:0}}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--s3);color:var(--mu);white-space:nowrap}
.tag.acc{background:rgba(var(--acc-rgb),.16);color:var(--acc)}
.tag.mine{background:rgba(232,208,107,.16);color:var(--warn)}
.tag.out{background:rgba(240,128,106,.16);color:var(--out)}
.dev{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative}
.dev button{position:relative;z-index:1;flex:1;min-width:70px;text-align:center;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:500;color:var(--mu);transition:color .25s}
.dev button.on{color:#10201f}
.dev i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--acc);transition:transform .4s var(--ease)}
.dev.r i{transform:translateX(100%)}
.scroll{flex:1;overflow:auto;padding:14px 30px 40px;scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
.view{will-change:transform,opacity}
.view.out-l{animation:out-l .18s ease-in forwards}.view.out-r{animation:out-r .18s ease-in forwards}
.view.in-r{animation:in-r .5s var(--ease)}.view.in-l{animation:in-l .5s var(--ease)}
@keyframes out-l{to{transform:translateX(-46px);opacity:0}}@keyframes out-r{to{transform:translateX(46px);opacity:0}}
@keyframes in-r{from{transform:translateX(64px);opacity:0}}@keyframes in-l{from{transform:translateX(-64px);opacity:0}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{grid-column:span 12;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.card:hover{border-color:rgba(var(--acc-rgb),.28)}
@keyframes rise{from{transform:translateY(22px);opacity:0}}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c3{grid-column:span 3}
.card h3{font-size:12px;font-weight:500;color:var(--mu);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.big{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.mid{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.in{color:var(--acc)}.ou{color:var(--out)}.sm{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
/* hero */
.hero{display:flex;gap:26px;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 0 0,rgba(var(--acc-rgb),.13),transparent);pointer-events:none}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--s3)}
.ring .fg{stroke:var(--acc);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.3s var(--ease),stroke .4s}
.ready .ring .fg{stroke-dashoffset:var(--off)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.ring b small{font-size:10px;font-weight:500;color:var(--mu)}
.kp{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.kp div>span:first-child{display:block;font-size:11px;color:var(--mu)}
.kp div b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-size:11px;font-weight:600;margin-left:6px}
/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:6px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;cursor:pointer;position:relative}
.col .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.col .bars i{display:block;width:42%;max-width:15px;border-radius:5px 5px 2px 2px;height:0;transition:height 1s var(--ease),opacity .3s,filter .3s;transition-delay:calc(var(--n)*35ms)}
.ready .col .bars i{height:var(--h)}
.col .bi{background:var(--acc)}.col .bo{background:var(--out)}
.col.plan .bars i{opacity:.45}
.col span{font-size:10px;color:var(--mu);transition:color .2s}
.col:hover .bars i{filter:brightness(1.25)}
.col.cur span{color:var(--tx);font-weight:600}
.col.cur:after{content:"";position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.col .tip{position:absolute;bottom:100%;left:50%;transform:translate(-50%,6px);background:var(--s3);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:5}
.col:hover .tip{opacity:1;transform:translate(-50%,-4px)}
.lg{display:flex;gap:14px;font-size:11px;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0}
.lg i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;flex:none}
/* hbars */
.hb{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.hb .nm{display:flex;align-items:center;font-size:13px;white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s var(--ease);transition-delay:calc(var(--n,0)*60ms)}
.ready .track i{width:var(--w)}
.hb .am{font-variant-numeric:tabular-nums;font-weight:500;text-align:right;font-size:13px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--s3);margin:4px 0 14px}
.stack i{display:block;height:100%;width:0;transition:width 1.1s var(--ease)}
.ready .stack i{width:var(--w)}
.ins{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0;padding-top:0}
.ins .ic{width:34px;height:34px;border-radius:11px;background:rgba(var(--acc-rgb),.14);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.ins.w .ic{background:rgba(232,208,107,.14);color:var(--warn)}
.ins b{font-weight:600;display:block;margin-bottom:2px}
.ins p{font-size:12.5px;color:var(--mu)}
/* list */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--mu);font-size:12.5px;font-weight:500;transition:all .25s var(--ease)}
.chip:hover{color:var(--tx);transform:translateY(-1px)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#10201f}
.grp{margin-bottom:14px}
.gh{display:flex;align-items:center;gap:10px;padding:0 4px 8px;font-size:12px;color:var(--mu);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin-bottom:6px;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*28ms);transition:transform .25s var(--ease),background .2s}
.li:hover{transform:translateX(5px);background:var(--s3)}
.li .av{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:11px;color:var(--mu)}
.li .a{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.li .a small{display:block;font-size:10.5px;font-weight:500}
.li[data-pay]{cursor:pointer}
.a[data-edit],.a[data-iedit]{cursor:text}
.li .t b.nm{display:inline-block;max-width:100%;vertical-align:top;cursor:text;border-bottom:1px dashed transparent;transition:border-color .2s,color .3s}
.li .t b.nm:hover{border-bottom-color:var(--acc);color:var(--tx)}
.li .t b.nm:has(input){display:block;overflow:visible;text-decoration:none}
input.pe.ne{width:min(280px,100%);text-align:left;font-weight:500}
.li .t>span{display:block}
.a .ed{display:inline-block;padding:3px 8px;margin:-3px -8px;border-radius:9px;border-bottom:1px dashed transparent;transition:background .2s,border-color .2s}
.a[data-edit]:hover .ed,.a[data-iedit]:hover .ed{background:var(--bg);border-bottom-color:var(--acc);color:var(--tx)}
input.pe{width:120px;text-align:right;background:var(--bg);border:1px solid var(--acc);border-radius:10px;padding:7px 10px;font-weight:600;outline:0;box-shadow:0 0 0 4px rgba(var(--acc-rgb),.18);animation:pop .3s}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.28);flex:none;position:relative;transition:background .25s,border-color .25s,transform .2s}
.li:hover .ck{border-color:var(--acc)}
.ck:after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid #10201f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.paid .ck{background:var(--acc);border-color:var(--acc);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.paid .ck:after{transform:rotate(45deg) scale(1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.li .t b,.li .a{transition:color .3s}
.paid .t b{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.paid .a{color:var(--mu)}.paid .av{opacity:.5}
/* stacked months */
.sm6{display:flex;gap:14px;align-items:flex-end;height:190px}
.sm6 .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.sm6 .st{width:100%;max-width:54px;display:flex;flex-direction:column-reverse;border-radius:9px;overflow:hidden;height:0;transition:height 1.1s var(--ease);transition-delay:calc(var(--n)*70ms)}
.ready .sm6 .st{height:var(--h)}
.sm6 .st i{display:block;width:100%}
/* progress */
.pr{height:8px;border-radius:99px;background:var(--s3);overflow:hidden;margin:10px 0 6px}
.pr i{display:block;height:100%;width:0;border-radius:99px;background:var(--acc);transition:width 1.2s var(--ease)}
.ready .pr i{width:var(--w)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:var(--s3);outline:0;margin:14px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--acc);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--acc);cursor:grab;transition:transform .2s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
/* story */
.story{position:relative;height:330px;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,rgba(var(--acc-rgb),.22),var(--s2) 55%);border:1px solid var(--line);cursor:pointer;user-select:none}
.sbars{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:6px;z-index:2}
.sbars i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.sbars i:before{content:"";display:block;height:100%;width:0;background:#fff}
.sbars i.done:before{width:100%}
.sbars i.act:before{animation:fill 5.5s linear forwards}
@keyframes fill{to{width:100%}}
.slide{position:absolute;inset:0;padding:48px 34px 30px;display:flex;flex-direction:column;justify-content:center}
.slide.e-r{animation:in-r .55s var(--ease)}.slide.e-l{animation:in-l .55s var(--ease)}
.slide small{font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.slide h2{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px;animation:rise .7s var(--ease) .1s both}
.slide p{color:var(--mu);max-width:520px;animation:rise .7s var(--ease) .22s both}
.snav{position:absolute;bottom:14px;right:18px;font-size:11px;color:var(--mu)}
/* switch */
.sw{width:44px;height:26px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .3s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .35s var(--ease)}
.sw.on{background:var(--acc)}.sw.on:after{transform:translateX(18px)}
.set{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set div{flex:1}.set div span{display:block;font-size:12px;color:var(--mu)}
.sws{display:flex;gap:10px}
.swc{width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:transform .25s var(--ease),border-color .25s}
.swc:hover{transform:scale(1.15)}.swc.on{border-color:#fff;transform:scale(1.1)}
.seg{display:flex;background:var(--s3);border-radius:11px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:12px;color:var(--mu);transition:all .25s}
.seg button.on{background:var(--bg);color:var(--tx)}
/* modal */
.ov{position:absolute;inset:0;z-index:20;background:rgba(10,9,9,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:min(440px,92%);background:var(--s2);border:1px solid var(--line);border-radius:24px;padding:24px;transform:translateY(40px) scale(.96);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.3,1),opacity .3s}
.ov.on .sheet{transform:none;opacity:1}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;color:var(--mu);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fld input{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;transition:border-color .25s,box-shadow .25s}
.fld input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.15)}
.amt{font-size:30px!important;font-weight:600;text-align:center}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:13px;font-weight:600;background:var(--s3);transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}.btn.p{background:var(--acc);color:#10201f}
.toast{position:absolute;left:50%;bottom:28px;z-index:30;transform:translate(-50%,80px);background:var(--tx);color:#141213;padding:12px 20px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.3,1),opacity .3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.fab{display:none}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mu);padding:0 4px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--acc);transition:background .3s}
.sync.busy i{background:var(--warn);animation:blink 1s ease-in-out infinite}.sync.err i{background:var(--out)}.sync.err{color:var(--out)}
@keyframes blink{50%{opacity:.3}}
.mobile .sync{order:-1}.mobile .sync span{display:none}.mobile .sync.err span{display:inline}
#undo{margin-left:10px;padding:4px 10px;border-radius:99px;background:#141213;color:#fff;font-size:12px;font-weight:600}
.xb{width:22px;height:22px;border-radius:50%;color:var(--mu);font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.xb:hover{background:rgba(240,128,106,.18);color:var(--out)}
.gn,.gt{cursor:text;border-bottom:1px dashed transparent;transition:border-color .2s}.gn:hover,.gt:hover{border-bottom-color:var(--acc)}
.gn{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--tx)}
.li button.av{cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}.li button.av:hover{transform:scale(1.1);box-shadow:0 0 0 2px rgba(var(--acc-rgb),.5)}
.fdel{display:block;width:100%;margin-top:12px;padding:11px;border-radius:13px;color:var(--out);font-weight:500;font-size:13px;transition:background .2s}.fdel:hover{background:rgba(240,128,106,.12)}
.login.chk .fld,.login.chk .lbtn,.login.chk .lerr{display:none}
.lload{display:none;align-items:center;gap:10px;color:var(--mu);font-size:13px}.login.chk .lload{display:flex}
.lload i{width:18px;height:18px;box-sizing:border-box;border-radius:50%;border:2.5px solid var(--acc);border-top-color:transparent;animation:spin .7s linear infinite}
.notes{border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden;background:rgba(255,255,255,.012);animation:rise .6s var(--ease) both}
.notes .note{margin:0;border:0;border-radius:0;background:none;animation:none}
.notes .note+.note{border-top:1px solid var(--line)}
.notes .note:hover{background:rgba(255,255,255,.03)}
.note.n-in i,.note.n-in i:after{background:var(--acc);border-color:var(--acc)}.note.n-in em{color:var(--acc)}
.note.n-inv i,.note.n-inv i:after{background:var(--out);border-color:var(--out)}.note.n-inv em{color:var(--out)}
.note i:after{background:none!important}
.ck.off{visibility:hidden}
.sm6 .c{min-width:0}
.chip.qa{padding:6px 12px;font-size:12px}
.li[data-ipay]{cursor:pointer}
.lerr{min-height:20px;margin-top:12px;font-size:12.5px;color:var(--out);text-align:center}
.sheet{max-height:92%;overflow:auto}
.note{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;margin-bottom:14px;border-radius:13px;border:1px solid var(--line);background:rgba(232,208,107,.045);font-size:12.5px;color:var(--mu);text-align:left;animation:rise .6s var(--ease) both;transition:border-color .3s,background .3s}
.note:hover{border-color:rgba(232,208,107,.4);background:rgba(232,208,107,.08)}
.note i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.note i:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--warn);opacity:0;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}70%,100%{transform:scale(1.5);opacity:0}}
.note span{flex:1;min-width:0}.note b{color:var(--tx);font-weight:600;white-space:nowrap}
.note em{font-style:normal;color:var(--warn);white-space:nowrap;font-weight:500}
.icos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.icb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;border-radius:16px;border:1px solid transparent;font-size:11px;color:var(--mu);transition:all .3s var(--ease)}
.icb img{width:100%;max-width:68px;aspect-ratio:1;border-radius:24%;display:block;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .35s var(--ease)}
.icb:hover img{transform:translateY(-3px) scale(1.04)}
.icb.on{border-color:var(--acc);background:rgba(var(--acc-rgb),.08);color:var(--tx)}
.login{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s var(--ease),transform .9s var(--ease),visibility 0s .9s}
.login.out{opacity:0;transform:scale(1.07);visibility:hidden;pointer-events:none}
.login:before,.login:after{content:"";position:absolute;width:620px;height:620px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(var(--acc-rgb),.2),transparent 62%);animation:drift 12s ease-in-out infinite alternate}
.login:before{top:-260px;left:-200px}.login:after{bottom:-300px;right:-220px;animation-duration:17s;animation-direction:alternate-reverse}
.wv{position:absolute;left:0;bottom:0;width:200%;height:110px;fill:rgba(var(--acc-rgb),.13);animation:wv 13s linear infinite}
.wv.w2{height:160px;fill:rgba(var(--acc-rgb),.07);animation-duration:21s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-50%)}}
.lbox{position:relative;z-index:1;width:min(350px,84%);display:flex;flex-direction:column}
.lbox>*{animation:rise .9s var(--ease) both}
.lbox>*:nth-child(1){animation-delay:.1s}.lbox>*:nth-child(2){animation-delay:.2s}.lbox>*:nth-child(3){animation-delay:.28s}.lbox>*:nth-child(4){animation-delay:.38s}.lbox>*:nth-child(5){animation-delay:.46s}.lbox>*:nth-child(6){animation-delay:.56s}.lbox>*:nth-child(7){animation-delay:.7s}
.lico{width:64px;height:64px;border-radius:24%;margin-bottom:22px;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px var(--line)}
.llogo{display:flex;align-items:flex-end;gap:10px;height:38px;margin-bottom:10px}.llogo img{height:100%}.llogo span{font-size:25px;margin-bottom:-5px}
.lsub{color:var(--mu);margin-bottom:26px}
.lbtn{position:relative;align-self:center;width:100%;height:50px;border-radius:14px;background:var(--acc);color:#10201f;font-weight:600;margin-top:6px;transition:width .5s var(--ease),border-radius .5s var(--ease),transform .2s,box-shadow .3s}
.lbtn:hover{box-shadow:0 10px 28px rgba(var(--acc-rgb),.35)}.lbtn:active{transform:scale(.97)}
.lbtn span{transition:opacity .2s}
.lbtn.busy{width:50px;border-radius:25px;pointer-events:none}.lbtn.busy span{opacity:0}
.lbtn.busy:after{content:"";position:absolute;left:14px;top:14px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2.5px solid #10201f;border-top-color:transparent;animation:spin .7s linear infinite}
.lbtn.ok:after{animation:okp .45s cubic-bezier(.2,1.6,.4,1);left:20px;top:13px;width:10px;height:18px;border-radius:0;border:solid #10201f;border-width:0 3px 3px 0;transform:rotate(45deg)}
@keyframes okp{0%{transform:rotate(45deg) scale(.3)}60%{transform:rotate(45deg) scale(1.25)}100%{transform:rotate(45deg) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.lnote{margin-top:16px;font-size:11.5px;color:var(--mu);text-align:center}
.mobile .side{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.mobile .view{max-width:640px;margin:0 auto}
.scroll{overflow-x:hidden}
.col:nth-last-child(-n+3) .tip{left:auto;right:-4px;transform:translate(0,6px)}.col:nth-last-child(-n+3):hover .tip{transform:translate(0,-4px)}
.col:nth-child(-n+2) .tip{left:-4px;transform:translate(0,6px)}.col:nth-child(-n+2):hover .tip{transform:translate(0,-4px)}
.mobile .li .t b{white-space:normal;line-height:1.25}

.tag{font-style:normal}.dsk{font-style:normal}
.card h3{flex-wrap:wrap}
.mhint{display:none;text-align:center;font-size:11px;color:var(--mu);margin-top:22px}

.mobile .dsk{display:none}

.mobile .kp b{font-size:15px}.mobile .kp .delta{display:block;margin:2px 0 0}
.mobile .hbx{grid-template-columns:1fr auto}.mobile .hbx .track{display:none}

.mobile .card h3{margin-bottom:12px}
.mobile .li{padding:12px}

.calm *{animation-duration:.01s!important;transition-duration:.01s!important}

.mobile .app{flex-direction:column}.mobile .main{min-height:0}
.mobile .side{order:2;width:100%;flex-direction:row;padding:8px 10px 12px;border-right:0;border-top:1px solid var(--line)}
.mobile .logo,.mobile .add,.mobile .hint{display:none}
.mobile .nav{flex-direction:row;flex:1;gap:0}
.mobile .nav button{flex:1;flex-direction:column;gap:3px;padding:8px 0;font-size:9px;justify-content:center;align-items:center}
.mobile .ind{height:100%}.mobile .ind:after{left:30%;right:30%;width:auto;top:auto;bottom:2px;height:3px}
.mobile .top{padding:18px 16px 6px;flex-wrap:wrap;gap:10px}
.mobile .top h1{font-size:19px;flex:1 1 0;order:-2;display:flex;align-items:center;gap:10px}
.mobile .top h1:before{content:"";width:26px;height:26px;background:var(--q) center/contain no-repeat;flex:none}
.mobile .dev{order:-1}.mobile .month{flex:1 1 100%}.mobile .mlab{flex:1;width:auto}
.mobile .scroll{padding:10px 16px 90px}
.mobile .card{grid-column:span 12!important}
.mobile .big{font-size:38px}
.mobile .hero{flex-direction:column;align-items:flex-start;gap:16px}
.mobile .hero .ring{position:absolute;right:16px;top:16px;width:84px;height:84px}
.mobile .ring b{font-size:15px}.mobile .ring b small{font-size:8px;margin-top:-1px}
.mobile .chart{gap:3px;height:140px}
.mobile .slide h2{font-size:25px}.mobile .slide{padding:44px 22px 26px}
.mobile .fab{display:flex;position:absolute;right:18px;bottom:84px;z-index:10;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#10201f;font-size:28px;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(var(--acc-rgb),.4);transition:transform .25s var(--ease)}
.mobile .fab:active{transform:scale(.9) rotate(90deg)}
.mobile .ov{align-items:flex-end}.mobile #view .chips.fl{flex:1 1 100%!important;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.mobile #view .chips.fl::-webkit-scrollbar{display:none}.mobile #view .chips.fl .chip{flex:none}.mobile #view .seg{flex:1}.mobile #view .seg button{flex:1}.mobile .toast{bottom:150px}

 else if(d.act==='add'){S.ft=S.view===2?'in':'out';sheet(true)}else if(d.act==='addin'){S.ft='in';sheet(true)}else if(d.act==='close')sheet(false);else if(d.act==='save')save();
 else if(d.act==='del'){const ed=S.edit;sheet(false);if(ed)del(ed.kind,ed.id)}
 else if(d.act==='copy')copyPrev();
 else if(d.ed){e.stopPropagation();sheet(true,{kind:'out',id:d.ed})}else if(d.ied){e.stopPropagation();if(d.pym&&d.pym!==ym){month(d.pym);return}sheet(true,{kind:'in',id:d.ied})}
 else if(d.nedit){const x=Mo(ym).items.find(i=>i.id===d.nedit);if(x)inline(t,'ne',x.n,v=>{v=v.trim().slice(0,60);if(v&&v!==x.n){const o=x.n;mut(ym,m=>{m.items.find(i=>i.id===d.nedit).n=v});toast(o+' -> '+v)}draw()},'text')}
 else if(d.edit){const x=Mo(ym).items.find(i=>i.id===d.edit);if(x)inline(t,'',fmtA(x.a),v=>{const a=pnum(v);if(a>=0&&Math.abs(a-x.a)>.004){const o=x.a;mut(ym,m=>{m.items.find(i=>i.id===d.edit).a=a});toast(x.n+': '+eur(o)+' -> '+eur(a))}draw()})}
 else if(d.iedit){const x=Mo(ym).inc.find(i=>i.id===d.iedit);if(x)inline(t,'',fmtA(x.a),v=>{const a=v.trim()===''?0:pnum(v);if(a>=0&&Math.abs(a-x.a)>.004){mut(ym,m=>{m.inc.find(i=>i.id===d.iedit).a=a});toast(x.n.trim()+': '+eur(a))}draw()})}
 else if(d.pay){let now;mut(ym,m=>{const x=m.items.find(i=>i.id===d.pay);x.paid=!x.paid;now=x.paid});if(S.filter==='neplačano')draw();else{t.classList.toggle('paid',now);payUpd()}toast(now?'Označeno kot plačano':'Označeno kot neplačano')}
 else if(d.grp!=null){S.grp=+d.grp;draw()}else if(d.f){S.filter=d.f;draw()}
 else if(d.ft){S.ft=d.ft;fcats()}else if(d.fc){S.fc=d.fc;fcats()}else if(d.fty){S.fty=d.fty;fcats()}else if(t.id==='fob'){S.fob=S.fob?0:1;fcats()}else if(t.id==='fes'){S.fes=S.fes?0:1;fcats()}
 else if(t.id==='story'){const r=t.getBoundingClientRect();story(e.clientX-r.left<r.width*.35?-1:1)}
 else if(d.obend!=null)inline(t,'ne',(D.set.obEnd||{})[d.obend]||'',v=>{setMut(s=>{s.obEnd=s.obEnd||{};if(/^\d{4}-\d{2}$/.test(v))s.obEnd[d.obend]=v;else delete s.obEnd[d.obend]});draw()},'month')
 else if(d.gname){const g=D.set.goals.find(x=>x.id===d.gname);if(g)inline(t,'ne',g.n,v=>{v=v.trim().slice(0,40);if(v)setMut(()=>{g.n=v});draw()},'text')}
 else if(d.gtarget){const g=D.set.goals.find(x=>x.id===d.gtarget);if(g)inline(t,'',String(Math.round(g.target)),v=>{const a=pnum(v);if(a>0)setMut(()=>{g.target=a});draw()})}
 else if(d.gdel){const ix=D.set.goals.findIndex(x=>x.id===d.gdel),bak=D.set.goals[ix];if(bak){setMut(s=>s.goals.splice(ix,1));draw();toast('Izbrisano: '+bak.n,()=>{setMut(s=>s.goals.splice(ix,0,bak));draw()})}}
 else if(d.act==='goal'){setMut(s=>s.goals.push({id:uid(),n:'Nov cilj',target:1000,monthly:100}));draw()}
 else if(d.act==='goalres'){const y=closed();setMut(s=>s.goals.push({id:uid(),n:'Varnostna rezerva',target:Math.round(y.avgE*3),monthly:200}));draw()}
 else if(d.act==='newcat')inline(t,'ne','',v=>{v=v.trim().slice(0,30);if(v)setMut(s=>s.cats.push({k:'c'+uid(),n:v,color:CCOL[(Object.keys(BASE).length+s.cats.length)%CCOL.length]}));draw()},'text')
 else if(d.cdel){setMut(s=>{s.cats=s.cats.filter(c=>c.k!==d.cdel)});draw();toast('Kategorija izbrisana. Stroški v njej so zdaj pod Drugo.')}
 else if(d.acc!=null){setMut(s=>s.acc=+d.acc);applySet();$$('.swc').forEach(x=>x.classList.toggle('on',x===t));toast('Barva spremenjena')}
 else if(d.den!=null){setMut(s=>s.compact=d.den==='1'?1:0);applySet();$$('[data-den]').forEach(x=>x.classList.toggle('on',x===t));setTimeout(nav,50)}
 else if(d.calm!=null){setMut(s=>s.calm=s.calm?0:1);t.classList.toggle('on');applySet()}
 else if(d.w){setMut(s=>s.w[d.w]=s.w[d.w]?0:1);t.classList.toggle('on');toast(D.set.w[d.w]?'Kartica prikazana':'Kartica skrita')}
 else if(d.tab){const k=d.tab;setMut(s=>s[k]=s[k]?0:1);if(k==='redni'&&D.set.redni&&S.grp===2)S.grp=0;t.classList.toggle('on');navOff();setTimeout(nav,360);toast((k==='recap'?'Recap':'Zavihek Redni stroški')+(D.set[k]?' vklopljen':' izklopljen'))}});
document.addEventListener('input',e=>{const g=e.target.dataset.g;if(g){const x=D.set.goals.find(i=>i.id===g);if(x){x.monthly=+e.target.value;queue('s');goalUpd()}}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')sheet(false)});
document.addEventListener('keydown',e=>{if(!$('#login').classList.contains('out'))return;
 if(e.target.tagName==='INPUT'){if($('#ov').classList.contains('on')){if(e.key==='Enter')save();if(e.key==='Escape')sheet(false)}return}
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='ArrowLeft')month(ymAdd(S.ym,-1));else if(e.key==='ArrowRight')month(ymAdd(S.ym,1));else if(e.key>='1'&&e.key<='7')go(+e.key-1);else if(e.key.toLowerCase()==='n'){e.preventDefault();S.ft=S.view===2?'in':'out';sheet(true)}else if(e.key==='Escape')sheet(false)});
addEventListener('resize',()=>layout());
let tx=null,ty=0,tt=null;const scr=$('#scroll');
scr.addEventListener('touchstart',e=>{tt=e.target;if(tt.closest('.chips.fl,input,.chart,.sm6')){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
scr.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)<70||Math.abs(dy)>50)return;if(tt.closest('#story'))story(dx<0?1:-1);else month(ymAdd(S.ym,dx<0?1:-1))},{passive:true});
if(document.readyState==='complete')boot();else addEventListener('load',boot);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>nav());
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
